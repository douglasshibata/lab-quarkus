services:
  quarkus:
    environment:
      # Configurable logging and tracing endpoints with environment variable fallbacks
      - QUARKUS_LOG_HANDLER_GELF_HOST=${GELF_HOST:-graylog}
      - QUARKUS_LOG_HANDLER_GELF_PORT=${GELF_PORT:-12201}
      - QUARKUS_OPENTELEMETRY_TRACER_EXPORTER_OTLP_ENDPOINT=${OTLP_ENDPOINT:-http://jaeger:4317}
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail localhost:8080/q/health || exit 1"]
      interval: 5s
      timeout: 1s
      retries: 5
    labels:
      - traefik.enable=true
